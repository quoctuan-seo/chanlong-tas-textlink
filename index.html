<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chan Long · Mô hình TAS & Textlink</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;color:#2b1620;background:#f6f1e7}body{display:flex;flex-direction:column}header{padding:15px 24px;border-bottom:1px solid #e2d6bc;background:#fff;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.brand{font-size:13px;font-weight:800;letter-spacing:.07em;color:#721907}.brand small{display:block;font-size:11px;font-weight:450;letter-spacing:0;color:#73656a;margin-top:3px}nav{display:flex;gap:6px;align-items:center}nav a,button,.separate{font:600 13px/1.3 system-ui;padding:10px 16px;border:1px solid #e2d6bc;border-radius:8px;background:#fff;color:#721907;text-decoration:none;cursor:pointer}nav a[aria-current="page"]{background:#721907;color:#fff;border-color:#721907}nav a:hover,button:hover,.separate:hover{box-shadow:0 0 0 2px #ede2c8}.actions{margin-left:auto;display:flex;gap:8px;align-items:center}.separate{border-color:transparent}iframe{display:block;width:100%;border:0;flex:1;min-height:0;background:white}a:focus-visible,button:focus-visible{outline:3px solid #b8892b;outline-offset:3px}@media(max-width:650px){header{padding:12px;gap:12px}.brand{width:100%}.actions{margin-left:0}nav a,button,.separate{padding:9px 11px;font-size:12px}}
</style></head><body>
<header><div class="brand">CHAN LONG PICKLEBALL<small>Hai mô hình · Một trang xem</small></div>
<nav aria-label="Chọn mô hình"><a href="#tas" id="nav-tas" aria-current="page">01 · Mô hình TAS</a><a href="#textlink" id="nav-textlink">02 · Sơ đồ Textlink</a></nav>
<div class="actions"><button id="fit" type="button" aria-pressed="true">Vừa màn hình</button><a class="separate" id="separate" href="tas.html?v=ad33b5c02c" target="_blank" rel="noopener">Mở riêng ↗</a></div></header>
<iframe id="model" title="Mô hình TAS Chan Long" src="tas.html?v=ad33b5c02c"></iframe>
<script>
const frame=document.getElementById('model'),fitButton=document.getElementById('fit');let fit=true;
function size(){const doc=frame.contentDocument;if(!doc||!doc.body)return;doc.body.style.zoom='1';if(fit&&location.hash!=='#textlink'){const width=Math.max(doc.body.scrollWidth,1640);doc.body.style.zoom=String(Math.min(1,frame.clientWidth/width));}}
function show(){const key=location.hash==='#textlink'?'textlink':'tas';for(const id of ['tas','textlink']){const link=document.getElementById('nav-'+id);if(id===key)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');}const file=key+'.html?v='+(key==='textlink'?'acf7a555cb':'ad33b5c02c');if(frame.getAttribute('src')!==file)frame.src=file;frame.title=key==='tas'?'Mô hình TAS Chan Long':'Sơ đồ textlink Chan Long';document.getElementById('separate').href=file;fitButton.hidden=key==='textlink';size();}
fitButton.addEventListener('click',()=>{fit=!fit;fitButton.setAttribute('aria-pressed',String(fit));fitButton.textContent=fit?'Vừa màn hình':'Kích thước 100%';size();});frame.addEventListener('load',size);window.addEventListener('resize',size);window.addEventListener('hashchange',show);show();
</script></body></html>
